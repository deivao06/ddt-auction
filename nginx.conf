# The whole project is mounted as a volume, but only these two files exist as
# far as the web is concerned: everything else (.env, docker-compose.yml,
# README.md, .git) stays out of reach. The list is deliberately an allowlist —
# a denylist would forget the next file you drop into the project root.
server {
  listen 80;
  server_name _;
  root /srv/app;

  # No caching: the volume is edited live and the whole point is to reload and see.
  add_header Cache-Control "no-store";

  location = /            { try_files /index.html =404; }
  location = /index.html  { }
  location = /names.json  { default_type application/json; }
  location = /favicon.ico { return 204; }

  location / { return 404; }
}
